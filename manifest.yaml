# manifest.yaml — Multi-Project Registry for Agent Context Switching
#
# Agents parse this file to instantly understand all projects they can work on.
# Add your projects here. This file is committed and shared across the team.
#
# PATH CONVENTION:
#   - Paths are RELATIVE to the directory containing this file (agent-bootstrap/).
#   - '.'              → this repo (agent-bootstrap itself)
#   - '../my-app'      → sibling repo at <parent>/my-app
#   - './memory-bank'  → memory-bank/ inside this repo
#   - Agents must resolve relative paths against the manifest.yaml location before use.
#   - docs_path fields are relative to the agent-bootstrap repo root (not the project root).
#
# Assumes all repos are cloned as siblings under the same parent directory:
#   <anywhere>/
#   ├── agent-bootstrap/   ← this file lives here
#   ├── my-app/
#   └── other-repo/
#
# REPO BOOTSTRAPPING (for agents):
#   Before loading a project, resolve its path relative to this file's location.
#   If the resolved path does not exist on disk, clone it:
#     git clone <git_url> <resolved_absolute_path>
#   Then proceed to load the memory-bank and docs as normal.
#   agent-bootstrap itself is always already present (you're reading this file from it).
#
# NON-SIBLING LAYOUTS:
#   If your repos live in non-standard locations, copy manifest.template.yaml to a
#   local manifest.yaml, fill in absolute paths, and add manifest.yaml to .gitignore.

version: 0.5.0
last_updated: 2026-06-15

projects:
  - name: agent-bootstrap
    path: .
    git_url: https://github.com/gman-robotics/agent-bootstrap.git
    description: |
      Universal agent harness repository itself. Defines reusable agents, skills,
      workflows, and manifest system. Self-hosting example.
    primary_tech: Markdown, YAML, Mermaid
    memory_bank_path: ./memory-bank
    docs_path: docs/projects/agent-bootstrap
    notes: |
      This is the hub. All other projects inherit its AGENTS.md, skills, and agents.
      Use it as the base for any new project setup.

  # === ADD YOUR PROJECTS BELOW ===
  # Example for a sibling repo:
  # - name: my-app
  #   path: ../my-app
  #   git_url: https://github.com/your-org/my-app.git
  #   description: Production web application.
  #   primary_tech: Node.js, TypeScript, React
  #   memory_bank_path: ../my-app/memory-bank
  #   docs_path: docs/projects/my-app
  #   notes: |
  #     Uses cherry-pick-to-release-branch skill for hotfixes.

# How agents use this:
# 1. At session start or "switch to project X":
#    - Resolve the project's path and memory_bank_path relative to this file's directory.
#    - If the resolved path does not exist, clone it: git clone <git_url> <resolved_path>
#    - Load the project's memory_bank_path files (tiered read per memory-bank-protocol).
#    - Load the project's docs_path for technical reference (api-contracts, data-models, etc.).
#    - Set working directory context to the resolved path.
# 2. When task mentions a project not listed: Ask user to add it to manifest.yaml first.
# 3. For cross-project work: Load multiple memory-banks and doc paths as needed.
# 4. For team-wide standards: Read docs/shared/ in addition to project docs.

# Field reference:
#   name:             kebab-case unique identifier (used as directory key in docs/projects/)
#   path:             path to the project repo, relative to this manifest.yaml file
#   git_url:          HTTPS clone URL; agents use this to clone the repo if path does not exist
#   description:      human + agent readable summary
#   primary_tech:     comma-separated tech stack
#   memory_bank_path: path to the project's 6-file memory-bank/, relative to this manifest.yaml
#   docs_path:        relative path from agent-bootstrap repo root to project technical docs
#   notes:            (optional) free-form hints for agents
