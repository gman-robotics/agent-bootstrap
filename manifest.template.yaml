# manifest.template.yaml — Starter Template for Non-Sibling Repo Layouts
#
# WHO NEEDS THIS FILE:
#   - Teams whose repos are NOT all cloned as siblings under one parent directory.
#   - If your repos ARE siblings (the standard layout), use manifest.yaml
#     directly — it already uses relative paths and works for everyone.
#
# WHEN TO USE:
#   If your checkout looks like this (repos scattered across different directories):
#     /work/project-a/
#     /home/user/repos/project-b/
#   ...then copy this file to manifest.yaml and fill in absolute paths per machine.
#   Keep your local manifest.yaml out of git (add it to .gitignore) so machine-specific
#   paths don't conflict across the team.
#
# STANDARD LAYOUT (no template needed — just use manifest.yaml as-is):
#   <anywhere>/
#   ├── agent-bootstrap/   ← manifest.yaml uses '.', '../my-app', etc.
#   └── my-app/

version: 0.3.0
last_updated: 2026-05-13

projects:
  - name: agent-bootstrap
    path: /absolute/path/to/agent-bootstrap
    description: |
      Universal agent harness repository itself. Defines reusable agents, skills,
      workflows, and manifest system. Self-hosting example.
    primary_tech: Markdown, YAML, Mermaid
    memory_bank_path: /absolute/path/to/agent-bootstrap/memory-bank
    docs_path: docs/projects/agent-bootstrap
    notes: |
      This is the hub. All other projects inherit its AGENTS.md, skills, and agents.
      Use it as the base for any new project setup.

  # === ADD YOUR PROJECTS BELOW ===
  # - name: my-app
  #   path: /absolute/path/to/my-app
  #   description: What this project does.
  #   primary_tech: Node.js, TypeScript, React
  #   memory_bank_path: /absolute/path/to/my-app/memory-bank
  #   docs_path: docs/projects/my-app
  #   notes: |
  #     Any hints for agents working on this project.

# Field reference:
#   name:             kebab-case unique identifier (used as directory key in docs/projects/)
#   path:             path to the project repo (absolute or relative to this manifest.yaml file)
#   description:      human + agent readable summary
#   primary_tech:     comma-separated tech stack
#   memory_bank_path: path to the project's 6-file memory-bank/
#   docs_path:        relative path from agent-bootstrap repo root to project technical docs
#   notes:            (optional) free-form hints for agents
