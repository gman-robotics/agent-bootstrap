name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unittest-and-live-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dev requirements
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Verify INDEX live gate (check_skill_live)
        run: python3 scripts/index_skills.py

  verify-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dev requirements
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run verify-hub CI harness
        run: bash .cursor/skills/verify-hub/bin/verify-hub-ci
