name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unittest-and-live-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dev requirements
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Verify INDEX live gate (check_skill_live)
        run: python3 scripts/index_skills.py

  verify-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dev requirements
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run verify-hub CI harness
        run: bash .cursor/skills/verify-hub/bin/verify-hub-ci

  box-tools-shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: ShellCheck box-tools.sh
        run: shellcheck -x scripts/box-tools.sh

  box-tools-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pinned Debian bookworm-slim (digest from Docker Hub library/debian:bookworm-slim, linux/amd64).
    container:
      image: debian:bookworm-slim@sha256:a4672c0cb26fbdde88e38fa2dfb6c681942306680e41e4378b28770b6e79ee91
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install minimal deps for box-tools
        run: |
          apt-get update -qq
          apt-get install -y -qq bash curl ca-certificates python3 python3-pip

      - name: Assert --check fails when required tools are missing
        run: |
          set -euo pipefail
          if bash scripts/box-tools.sh --check; then
            echo "expected non-zero exit when rg/jq/markitdown are missing"
            exit 1
          fi

      - name: Install rg and jq via box-tools as non-root user
        run: |
          set -euo pipefail
          useradd -m -s /bin/bash boxci
          chown -R boxci:boxci "${GITHUB_WORKSPACE}"
          su boxci -s /bin/bash -c "cd \"${GITHUB_WORKSPACE}\" && bash scripts/box-tools.sh"

      - name: Pip-install markitdown for required --check (user-space)
        # markitdown is verify-only in box-tools; CI installs it with pip --user so --check can pass.
        run: |
          set -euo pipefail
          su boxci -s /bin/bash -c "python3 -m pip install --user --break-system-packages 'markitdown>=0.0.1'"

      - name: Assert --check passes for required tools
        run: |
          set -euo pipefail
          su boxci -s /bin/bash -c "cd \"${GITHUB_WORKSPACE}\" && export PATH=\"/home/boxci/.local/bin:\$PATH\" && bash scripts/box-tools.sh --check"
