name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest-and-live-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dev requirements
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Verify INDEX live gate (check_skill_live)
        run: python3 scripts/index_skills.py

  verify-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dev requirements
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run verify-hub CI harness
        run: bash .cursor/skills/verify-hub/bin/verify-hub-ci

  pr-body-format-advisory:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Advisory PR body format (never fails build)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/advisory_pr_body_format.py

  ub-gates:
    runs-on: ubuntu-latest
    # Coverage plus the mutator budget (20 minutes) needs more than the old advisory job.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run blocking ub-gates
        uses: ./.github/actions/ub-gates
        with:
          advisory: "0"
          base-ref: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
          coverage-command: coverage run -m unittest discover -s tests && mkdir -p target/coverage/python && coverage lcov -o target/coverage/python/lcov.info
          mutator-test-command: python -m unittest discover -s tests
          rust: "false"
          hub-path: "."

      - name: Crapper function contract
        env:
          UB_REQUIRE_CRAPPER: "1"
        run: python -m unittest tests.test_ub_crapper_contract

  box-tools-shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: ShellCheck box-tools.sh
        run: shellcheck -x scripts/box-tools.sh

  box-tools-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    # Pinned Debian bookworm-slim (digest from Docker Hub library/debian:bookworm-slim, linux/amd64).
    container:
      image: debian:bookworm-slim@sha256:a4672c0cb26fbdde88e38fa2dfb6c681942306680e41e4378b28770b6e79ee91
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install minimal deps for box-tools
        run: |
          apt-get update -qq
          apt-get install -y -qq bash curl ca-certificates python3 python3-pip passwd grep findutils

      - name: Assert --check fails when required tools are missing
        run: |
          set -euo pipefail
          if bash scripts/box-tools.sh --check --tools-only; then
            echo "expected non-zero exit when rg/jq/markitdown are missing"
            exit 1
          fi

      - name: Install tools via box-tools as non-root user
        run: |
          set -euo pipefail
          useradd -m -s /bin/bash boxci
          chown -R boxci:boxci "${GITHUB_WORKSPACE}"
          su boxci -s /bin/bash -c "cd \"${GITHUB_WORKSPACE}\" && bash scripts/box-tools.sh --install"

      - name: Pip-install pinned markitdown (verify-only in box-tools)
        run: |
          set -euo pipefail
          su boxci -s /bin/bash -c "python3 -m pip install --user --break-system-packages 'markitdown==0.1.9'"

      - name: Assert trafilatura imports
        run: |
          set -euo pipefail
          su boxci -s /bin/bash -c "python3 -c 'import trafilatura; print(trafilatura.__version__)'"

      - name: Assert second install run skips everything
        run: |
          set -euo pipefail
          out="$(su boxci -s /bin/bash -c "cd \"${GITHUB_WORKSPACE}\" && export PATH=\"/home/boxci/.local/bin:\$PATH\" && bash scripts/box-tools.sh --install")"
          echo "${out}"
          if echo "${out}" | grep -v '^skip '; then
            echo "expected every line to start with 'skip '"
            exit 1
          fi

      - name: Assert --check passes for tools and fails only on pstack (CI has no pstack)
        run: |
          set -euo pipefail
          su boxci -s /bin/bash -c "cd \"${GITHUB_WORKSPACE}\" && export PATH=\"/home/boxci/.local/bin:\$PATH\" && bash scripts/box-tools.sh --check --tools-only"
          set +e
          out="$(su boxci -s /bin/bash -c "cd \"${GITHUB_WORKSPACE}\" && export PATH=\"/home/boxci/.local/bin:\$PATH\" && bash scripts/box-tools.sh --check")"
          rc=$?
          set -e
          echo "${out}"
          [[ "${rc}" -eq 1 ]] || { echo "expected exit 1 without pstack, got ${rc}"; exit 1; }
          if echo "${out}" | grep -v '^pstack ' | grep -q 'missing (required)'; then
            echo "required tool missing"; exit 1
          fi
